<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="slider-section">
        <h1>Image Slider Library</h1>

        <div class="slider" aria-label="Image slider">

            <div class="slider-viewport">
                <div class="slider-track" id="sliderTrack">

                    <div class="slide">
                        <img
                            src="https://picsum.photos/id/1015/1200/700"
                            alt="Mountain landscape">
                    </div>

                    <div class="slide">
                        <img
                            src="https://picsum.photos/id/1016/1200/700"
                            alt="Forest and mountain landscape">
                    </div>

                    <div class="slide">
                        <img
                            src="https://picsum.photos/id/1025/1200/700"
                            alt="Dog outdoors">
                    </div>

                </div>
            </div>

<button
    type="button"
    class="nav-button prev"
    id="prevButton"
    aria-label="Previous image">
    &#10094;
</button>

<button
    type="button"
    class="nav-button next"
    id="nextButton"
    aria-label="Next image">
    &#10095;
</button>

            <div
                class="dots"
                id="dots"
                aria-label="Slide indicators">
            </div>

        </div>
    </main>

    <script src="Javascript.js"></script>

</body>
</html>
