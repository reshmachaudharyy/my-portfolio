<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="slider-section">

        <h1>Image Slider Library</h1>

        <div class="slider">

            <!-- Image viewing area -->
            <div class="slider-viewport">

                <div class="slider-track" id="sliderTrack">

                    <!-- Slide 1 -->
                    <div class="slide">
                        <img
                            src="image slider/Mountain landscape.jpg"
                            alt="Mountain landscape">
                    </div>

                    <!-- Slide 2 -->
                    <div class="slide">
                        <img
                            src="image slider/Forest and mountain landscape.jpg"
                            alt="Forest and mountain landscape">
                    </div>

                    <!-- Slide 3 -->
                    <div class="slide">
                        <img
                            src="image slider/Dog outdoors.jpg"
                            alt="Dog outdoors">
                    </div>

                </div>

            </div>

            <!-- Previous button -->
            <button
                type="button"
                class="nav-button prev"
                id="prevButton"
                aria-label="Previous image">
                &#10094;
            </button>

            <!-- Next button -->
            <button
                type="button"
                class="nav-button next"
                id="nextButton"
                aria-label="Next image">
                &#10095;
            </button>

            <!-- Indicator dots -->
            <div
                class="dots"
                id="dots"
                aria-label="Slide indicators">
            </div>

        </div>

    </main>

    <script src="Javascript.js"></script>

</body>
</html>
